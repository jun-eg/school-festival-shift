<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <!--
      「フォームを作る」で出る画面（→ issue #144）。担当者は名簿の画像を選ぶだけである。
      作り終えたら、画像を選ぶ中身を閉じて、作り終えた中身だけを出す（→ issue #244）。
      別のダイアログを開かないのは、この経路で開く画面を 1 枚に保つためである（→ scripts/M1②の宣言.json）。
      外から読み込むファイルは 0 個である（→ 6 の #5）。
      下の script の src は、ビルドが src/ui/form-picker.js の中身に差し替える（→ build.mjs）。出来上がりの HTML は外から読み込むものを持たない。
    -->
    <style>
      body {
        font-family: sans-serif;
        font-size: 13px;
        line-height: 1.7;
        margin: 16px;
        color: #202124;
      }
      p { margin: 0 0 12px; }
      .note { color: #5f6368; }
      button { font-size: 13px; padding: 6px 16px; }
      #state { white-space: pre-wrap; word-break: break-all; }
      .stopped { color: #b3261e; }
      .url { word-break: break-all; }
      h2 { font-size: 15px; margin: 0 0 16px; }
    </style>
  </head>
  <body>
    <div id="picker">
      <p>委員会から届いた<strong>調理名簿の画像</strong>を選んでください。フォームにそのまま貼られます。</p>
      <p><input type="file" id="picked" accept="image/*" /></p>
      <p><button id="run">フォームを作る</button></p>
      <p id="state" class="note"></p>
    </div>

    <div id="built" hidden>
      <h2>フォーム作成が完了しました！！</h2>
      <p>配る用 URL（LINE ノートに貼るなど）:<br /><a id="url" class="url" target="_blank"></a></p>
      <p>フォーム編集用 URL:<br /><a id="editUrl" class="url" target="_blank"></a></p>
      <p class="note">2 つの URL は「条件入力」シートの 9〜10 行目にも残っています。</p>
    </div>

    <script src="form-picker.js"></script>
  </body>
</html>
