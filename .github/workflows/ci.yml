# CI — PR と main への push で、repo の文書の検査と、柵（hook・検査の手）の検査を回す。
# コードを置いたら、型・lint・テスト・ビルドの job をここに足す。
# job 名（name:）はブランチ保護の必須ステータスに名指しされる。変えるときは保護の設定も直す。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    name: 文書の検査（リンクの実在・要約の古さ）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: 相対リンクが実在するファイルに解決するか
        run: node scripts/リンクの検査.mjs
      - name: 要約が原本（HEAD）より古くなっていないか
        run: node scripts/要約の検査.mjs --head

  hooks:
    name: hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: guard-bash の検査
        run: python3 .claude/hooks/guard-bash.test.py
      - name: scripts/ の検査（秘密の検査など）
        run: node --test "scripts/**/*.test.mjs"
